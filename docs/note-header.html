<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partomate note header</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap");

      :root {
        --tomato: #ff6347;
        --sand: #fdfbf7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--sand);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100vw;
        height: 100vh;
        min-height: 216px;
        padding: 8vh 8vw;
        background: var(--sand);
      }

      .brand-lockup {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
      }

      .tagline {
        color: #5c5549;
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI",
          YuGothic, "Yu Gothic Medium", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        font-size: 34px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.08em;
        text-align: center;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: clamp(22px, 3vw, 40px);
      }

      .brand-icon {
        width: clamp(112px, 12vw, 150px);
        height: clamp(112px, 12vw, 150px);
        flex: 0 0 auto;
        border-radius: 21%;
      }

      .brand-name {
        color: var(--tomato);
        font-family: "Outfit", "Avenir Next", Avenir, sans-serif;
        font-size: clamp(68px, 8vw, 102px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.045em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="header" aria-label="Partomate">
      <div class="brand-lockup">
        <div class="tagline">LLM対話型在庫管理アプリ</div>
        <div class="brand">
          <img
            class="brand-icon"
            src="../assets/icon/app.svg"
            alt=""
            width="150"
            height="150"
          />
          <div class="brand-name">Partomate</div>
        </div>
      </div>
    </main>
  </body>
</html>
